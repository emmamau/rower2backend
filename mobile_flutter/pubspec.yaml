name: rower_race_mobile
description: "RowerRace Mobile - Passerelle BLE FTMS & Régate Multijoueur Temps Réel"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Bluetooth Low Energy (FTMS 0x1826 & Rower Data 0x2AD1)
  flutter_blue_plus: ^1.31.14

  # HTTP REST Client & WebSocket
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1

  # Secure Storage & Hardware
  flutter_secure_storage: ^9.2.2
  wakelock_plus: ^1.2.8
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
