<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Launcher Icon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .launcher-box {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    svg {
      width: 96%;
      height: 96%;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.7));
    }
  </style>
</head>
<body>
  <div class="launcher-box">
    <svg viewBox="0 0 100 100">
      <defs>
        <radialGradient id="lWaterBg" cx="50%" cy="45%" r="50%">
          <stop offset="0%" stop-color="#122a54"/>
          <stop offset="65%" stop-color="#08152b"/>
          <stop offset="100%" stop-color="#020610"/>
        </radialGradient>
        <linearGradient id="lHullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ff0055"/>
          <stop offset="50%" stop-color="#ff6600"/>
          <stop offset="100%" stop-color="#ffe600"/>
        </linearGradient>
        <linearGradient id="lRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f0ff"/>
          <stop offset="50%" stop-color="#ff0055"/>
          <stop offset="100%" stop-color="#ffe600"/>
        </linearGradient>
      </defs>

      <!-- Outer Ring -->
      <circle cx="50" cy="50" r="46" fill="url(#lWaterBg)" stroke="url(#lRingGrad)" stroke-width="4.5"/>

      <!-- Water ripples -->
      <path d="M 16 65 C 34 58 66 58 84 65" fill="none" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
      <path d="M 24 74 C 38 69 62 69 76 74" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

      <!-- Kayak Hull -->
      <path d="M 10 50 C 23 42 77 42 90 50 C 77 58 23 58 10 50 Z" fill="url(#lHullGrad)" stroke="#ffffff" stroke-width="2"/>

      <!-- Cockpit Rim -->
      <ellipse cx="50" cy="49" rx="10" ry="3.5" fill="#060913" stroke="#ffe600" stroke-width="1.8"/>

      <!-- Paddler -->
      <path d="M 44 47 C 45 38 46 36 50 36 C 54 36 55 38 56 47 Z" fill="#ffffff"/>
      <circle cx="50" cy="30.5" r="5.5" fill="#00f0ff" stroke="#ffffff" stroke-width="1.8"/>

      <!-- Double Paddle -->
      <line x1="24" y1="21" x2="76" y2="79" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="22" cy="19" rx="7.5" ry="3.8" transform="rotate(-38 22 19)" fill="#ff0055" stroke="#ffffff" stroke-width="1.5"/>
      <ellipse cx="78" cy="81" rx="7.5" ry="3.8" transform="rotate(-38 78 81)" fill="#ff0055" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Spark Star -->
      <polygon points="50,9 52.5,15 58.5,16 54,20 55.5,26 50,22.5 44.5,26 46,20 41.5,16 47.5,15" fill="#ffe600" stroke="#ffffff" stroke-width="1"/>
    </svg>
  </div>
</body>
</html>
