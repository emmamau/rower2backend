<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="waterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1931"/>
      <stop offset="100%" stop-color="#000511"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
  </defs>

  <!-- Background Circle with Neon Cyan Border -->
  <circle cx="50" cy="50" r="46" fill="url(#waterBg)" stroke="#00f0ff" stroke-width="4"/>

  <!-- Water wake ripple effects -->
  <path d="M 16 64 C 34 58 66 58 84 64" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 24 72 C 38 68 62 68 76 72" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 32 80 C 42 77 58 77 68 80" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Kayak Hull (Dynamic streamlined boat) -->
  <!-- Bow is at (14, 50), stern is at (86, 50) -->
  <path d="M 12 50 C 24 43 76 43 88 50 C 76 57 24 57 12 50 Z" fill="url(#hullGrad)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Cockpit rim -->
  <ellipse cx="50" cy="50" rx="10" ry="3.5" fill="#060913" stroke="#ffe600" stroke-width="1.5"/>

  <!-- Paddler Torso & Helmet -->
  <path d="M 46 48 L 47 38 L 53 38 L 54 48 Z" fill="#ffffff"/>
  <circle cx="50" cy="33" r="5" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Kayak Double Paddle (Diagonal) -->
  <line x1="28" y1="26" x2="72" y2="74" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Top Left Blade -->
  <ellipse cx="26" cy="24" rx="6" ry="3" transform="rotate(-35 26 24)" fill="#ff0055" stroke="#ffffff" stroke-width="1"/>
  <!-- Bottom Right Blade -->
  <ellipse cx="74" cy="76" rx="6" ry="3" transform="rotate(-35 74 76)" fill="#ff0055" stroke="#ffffff" stroke-width="1"/>

  <!-- Energy / Speed Sparkles -->
  <polygon points="50,14 52,19 57,20 53,23 54,28 50,25 46,28 47,23 43,20 48,19" fill="#ffe600"/>
</svg>
