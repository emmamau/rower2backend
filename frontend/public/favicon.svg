<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle dark sport -->
  <circle cx="32" cy="32" r="30" fill="#080e1e" stroke="url(#waterGrad)" stroke-width="3" />
  
  <!-- Wave lines / speed wake -->
  <path d="M 10 38 Q 22 34 34 38 T 54 38" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 14 44 Q 24 41 34 44 T 50 44" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Kayak Hull -->
  <path d="M 10 32 C 16 28 48 28 54 32 C 48 36 16 36 10 32 Z" fill="url(#neonGlow)" filter="url(#glow)" />
  
  <!-- Cockpit Opening -->
  <ellipse cx="32" cy="32" rx="7" ry="2.5" fill="#080e1e" />

  <!-- Athlete Torso / Helmet -->
  <circle cx="32" cy="27" r="3.2" fill="#ffffff" />

  <!-- Double Paddle -->
  <line x1="20" y1="21" x2="44" y2="43" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <!-- Paddle blades -->
  <ellipse cx="19" cy="20" rx="3.5" ry="1.8" transform="rotate(-40 19 20)" fill="#ff0055" />
  <ellipse cx="45" cy="44" rx="3.5" ry="1.8" transform="rotate(-40 45 44)" fill="#ff0055" />

  <!-- Dynamic Energy Bolt -->
  <path d="M 44 10 L 37 20 L 42 20 L 35 30" fill="none" stroke="#ffe600" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
</svg>
