name: Build RowerRace Android APK

on:
  push:
    branches: [ version1, main, master ]
  pull_request:
    branches: [ version1, main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile_flutter
          flutter pub get

      - name: Run unit tests
        run: |
          cd mobile_flutter
          set +e
          flutter test --reporter expanded > ../test_results.txt 2>&1
          TEST_EXIT_CODE=$?
          set -e
          cat ../test_results.txt
          echo "### Flutter Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat ../test_results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "::error::Unit tests failed with exit code $TEST_EXIT_CODE!"
            exit $TEST_EXIT_CODE
          fi

      - name: Ensure Gradle wrapper executable
        run: chmod +x mobile_flutter/android/gradlew

      - name: Build Android Release APK
        run: |
          cd mobile_flutter
          flutter build apk --release --dart-define=API_URL=https://rower-api-service.onrender.com

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RowerRace-Mobile-APK
          path: mobile_flutter/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
