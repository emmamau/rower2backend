# Blueprint for Render Deployment
# This configuration deploys:
# 1. Managed PostgreSQL database (rower-postgres-db)
# 2. Node.js backend API (rower-api-service)
# 3. Angular Web Frontend (rower-dashboard-frontend)

databases:
  - name: rower-postgres-db
    databaseName: rower_db
    user: rower_user
    plan: free
    region: frankfurt # Change region if desired (frankfurt, oregon, ohio, etc.)

services:
  # Backend Node.js / Express / Sequelize API
  - type: web
    name: rower-api-service
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: rower-postgres-db
          property: connectionString

  # Angular Web Frontend (Static Site hosted on Render's Global CDN)
  # Note: In Render Blueprints, static sites use runtime: static, publishPath, and do NOT take a plan or region parameter.
  - type: web
    name: rower-dashboard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: rower-api-service
          property: host
