# Blueprint for Render Deployment
# This configuration creates a managed PostgreSQL database and a Node.js web service.
# The DATABASE_URL credential from the database is automatically shared with the API service.

databases:
  - name: rower-postgres-db
    databaseName: rower_db
    user: rower_user
    plan: free
    region: frankfurt # Change to oregon, ohio, etc., if preferred

services:
  - type: web
    name: rower-api-service
    env: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: rower-postgres-db
          property: connectionString

